name: Setup TeX Live for eason.sty
description: "Setup TeX Live in EasonSYC/latex-style"

runs:
  using: "composite"

  steps:

  - name: Checkout latex-style
    uses: actions/checkout@v6
    with:
      repository: EasonSYC/latex-style
      path: latex-style

  - name: Install TeX Live
    uses: zauguin/install-texlive@v4
    with:
      package_file: ${{ github.action_path }}/texlive.packages

  - name: Link Style Files
    shell: bash
    run: |
      texmf_home=$(kpsewhich -var-value=TEXMFHOME)
      echo $texmf_home

      mkdir -p $texmf_home/tex/latex/local
      ln -s latex-style/eason.sty $texmf_home/tex/latex/local/eason.sty
      ln -s latex-style/macros.tex $texmf_home/tex/latex/local/macros.tex

      kpsewhich eason.sty
      kpsewhich macros.tex

  - name: Install Python
    uses: actions/setup-python@v6
    with:
      python-version: '3.13'

  - name: Install Pygments
    shell: bash
    run: pip install -r ${{ github.action_path }}/requirements.txt