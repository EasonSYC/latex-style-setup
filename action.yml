name: Setup TeX Live for eason.sty
description: "Setup TeX Live in EasonSYC/latex-style"

runs:
  using: "composite"
  steps:
  
  - name: Install TeX Live
    uses: zauguin/install-texlive@v4
    with:
      package_file: ${{ github.action_path }}/texlive.packages

  - name: Install python
    uses: actions/setup-python@v6
    with:
      python-version: '3.13'

  - name: Install Pygments
    shell: bash
    run: pip install -r ${{ github.action_path }}/requirements.txt